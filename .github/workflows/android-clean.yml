name: Clean Build (No Cache)

on:
  workflow_dispatch:
    inputs:
      java-version:
        description: 'JDK version to use'
        required: false
        default: '17'
      gradle-args:
        description: 'Additional Gradle tasks/arguments (e.g. lint)'
        required: false
        default: ''

permissions:
  read-all

concurrency:
  group: clean-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read Go and NDK versions from gradle.properties
        run: |
          GO_VERSION=$(grep '^de\.schuelken\.cloudbridge\.goVersion=' gradle.properties | cut -d'=' -f2)
          NDK_VERSION=$(grep '^de\.schuelken\.cloudbridge\.ndkVersion=' gradle.properties | cut -d'=' -f2)
          echo "GO_VERSION=$GO_VERSION" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # No Gradle or Go cache is restored, so each run is a cold build.
      - name: Run clean debug build with no build cache
        env:
          GRADLE_ARGS_INPUT: ${{ inputs.gradle-args }}
        run: |
          read -r -a GRADLE_ARGS <<< "$GRADLE_ARGS_INPUT"
          ./gradlew clean assembleOssDebug --no-build-cache --stacktrace "${GRADLE_ARGS[@]}"
